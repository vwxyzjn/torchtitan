[project]
name = "torchtitan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

packages = ["torchtitan"]
dependencies = [
    "datasets>=3.6.0",
    "fsspec>=2025.3.0",
    "safetensors>=0.6.1",
    "tabulate>=0.9.0",
    "tensorboard>=2.20.0",
    "tokenizers>=0.15.0",
    "tomli>=1.1.0 ; python_full_version < '3.11'",
    "torch",
    "torchao",
    "torchvision",
    "pytorch-triton",
    "torchdata>=0.8.0",
    "tyro>=0.9.27",
    "wandb>=0.21.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-nightly-cu129" }]
torchvision = [{ index = "pytorch-nightly-cu129" }]
torchao = [{ index = "pytorch-nightly-cu129" }]
pytorch-triton = [{ index = "pytorch-nightly-cu129" }]

[[tool.uv.index]]
name = "pytorch-nightly-cu129"
url = "https://download.pytorch.org/whl/nightly/cu129"
explicit = true

[tool.uv]
prerelease = "allow"

